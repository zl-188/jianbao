name: Daily Brief

# 定时：UTC 22:30 = 北京时间次日 06:30（Actions 定时偶有延迟，属正常）
# 也可以在 Actions 页面点 Run workflow 手动跑一次
on:
  schedule:
    - cron: "7 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news and build pages
        run: python fetch.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "每日简报 $(TZ=Asia/Shanghai date +%F)"
          git push
